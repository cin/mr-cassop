replicas: 1
container:
  # Operator image. Leave empty to default to
  # ghcr.io/cin/mr-cassop/operator:<chart appVersion>. Set to pin or override.
  image: ""
  # imagePullSecret: container-registry-secret
  imagePullPolicy: IfNotPresent
  restartPolicy: Always
  resources:
    limits:
      cpu: 500m
      memory: 200Mi
    requests:
      cpu: 500m
      memory: 200Mi
logLevel: info
logFormat: json
# Component images. Leave empty to default to
# ghcr.io/cin/mr-cassop/<component>:<chart appVersion>. Set to pin or override.
proberImage: ""
jolokiaImage: ""
cassandraImage: ""
# reaper is an external image and is pinned independently of the chart version.
reaperImage: thelastpickle/cassandra-reaper:5.0.1
icarusImage: ""
uiImage: ""
# Whether a CassandraCluster that doesn't set spec.cassandra.podDisruptionBudget.enabled gets a
# PodDisruptionBudget per DC. Turn off for dev and local installs, where a drain should never be held up.
podDisruptionBudget:
  defaultEnabled: true
clusterDashboards:
  enabled: []
  namespace: ""
  labels:
    grafana_dashboard: "1"
monitoring:
  enabled: false
  grafanaDashboard:
    enabled: false
    namespace: ""
    labels:
      grafana_dashboard: "1"
    datasourceName: ""
  serviceMonitor:
    enabled: false
    namespace: ""
    labels:
      operator: mr-cassop
    scrapeInterval: 30s
admissionWebhooks:
  enabled: true
