{{- $imageRepo := "ghcr.io/cin/mr-cassop" -}}
{{- $imageTag := .Chart.AppVersion -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mr-cassop
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      operator: mr-cassop
  template:
    metadata:
      labels:
        operator: mr-cassop
    spec:
      {{- with .Values.container.imagePullSecret }}
      imagePullSecrets:
      - name:  {{ . | quote }}
      {{- end }}
      serviceAccountName: mr-cassop
      securityContext:
        runAsNonRoot: true
        runAsUser: 901
        runAsGroup: 901
        fsGroup: 901
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mr-cassop
          image: "{{ .Values.container.image | default (printf "%s/operator:%s" $imageRepo $imageTag) }}"
          imagePullPolicy: {{ .Values.container.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.container.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              port: 8042
              path: /readyz
          ports:
            - containerPort: 8329
              name: metrics
            - containerPort: 8042
              name: readyz
          env:
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: LEADERELECTION_ENABLED
              value: {{ if gt .Values.replicas 1.0 }}"true"{{ else }}"false"{{ end }}
            - name: LOGLEVEL
              value: {{ .Values.logLevel | quote }}
            - name: LOGFORMAT
              value: {{ .Values.logFormat | quote }}
            - name: DEFAULT_CASSANDRA_IMAGE
              value: {{ .Values.cassandraImage | default (printf "%s/cassandra:%s" $imageRepo $imageTag) | quote }}
            - name: DEFAULT_PROBER_IMAGE
              value: {{ .Values.proberImage | default (printf "%s/prober:%s" $imageRepo $imageTag) | quote }}
            - name: DEFAULT_JOLOKIA_IMAGE
              value: {{ .Values.jolokiaImage | default (printf "%s/jolokia:%s" $imageRepo $imageTag) | quote }}
            - name: DEFAULT_REAPER_IMAGE
              value: {{ .Values.reaperImage | quote }}
            - name: DEFAULT_ICARUS_IMAGE
              value: {{ .Values.icarusImage | default (printf "%s/icarus:%s" $imageRepo $imageTag) | quote }}
            - name: WEBHOOKS_ENABLED
              value: {{ .Values.admissionWebhooks.enabled | quote }}
          volumeMounts:
            - name: operator-home
              mountPath: /home/mr-cassop
      volumes:
        - name: operator-home
          emptyDir: {}
