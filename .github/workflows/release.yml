name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write
  packages: write

env:
  HELM_VERSION: v3.15.4
  NODE_VERSION: "24"
  ICARUS_VERSION: "3.0.0"

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: operator
            context: .
            dockerfile: Dockerfile
          - name: prober
            context: prober
            dockerfile: prober/Dockerfile
          - name: cassandra
            context: cassandra
            dockerfile: cassandra/Dockerfile
          - name: jolokia
            context: jolokia
            dockerfile: jolokia/Dockerfile
          - name: icarus
            context: icarus
            dockerfile: icarus/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare image metadata
        uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            ICARUS_VERSION=${{ env.ICARUS_VERSION }}

  helm-chart:
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Package chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm package ./mr-cassop --version "$version" --app-version "$version"

      - name: Upload chart to release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: mr-cassop-*.tgz

  docs:
    runs-on: ubuntu-latest
    needs: [helm-chart]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Pin quickstart to release version
        working-directory: docs
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -i "s/^export MR_CASSOP_VERSION=.*/export MR_CASSOP_VERSION=${version}/" docs/quickstart.md

      - name: Publish docs website
        working-directory: docs
        env:
          USE_SSH: false
          GIT_USER: github-actions[bot]
          GIT_PASS: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          CURRENT_BRANCH: main
          DEPLOYMENT_BRANCH: gh-pages
        run: |
          npm ci
          npx docusaurus deploy
