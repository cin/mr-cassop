name: Pull Request

on:
  pull_request:

env:
  GO_VERSION: "1.26.4"
  HELM_VERSION: v3.15.4
  NODE_VERSION: "24"
  ICARUS_VERSION: "3.0.0"
  TRIVY_SEVERITY: CRITICAL

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            prober/go.sum

      - name: Download operator dependencies
        run: go mod download

      - name: Download prober dependencies
        working-directory: prober
        run: go mod download

      - name: Vet operator
        run: go vet ./api/... ./controllers/... .

      - name: Test operator packages
        run: go test ./api/... ./controllers/... -v -coverprofile=operator_unit.out -coverpkg=./...

      - name: Test prober packages
        working-directory: prober
        run: go test ./... -v -coverprofile=prober_unit.out -coverpkg=./...

      - name: Report coverage
        run: |
          go tool cover -func=operator_unit.out | awk 'END {print "Operator unit tests coverage: " $3}'
          cd prober
          go tool cover -func=prober_unit.out | awk 'END {print "Prober unit tests coverage: " $3}'

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install envtest assets
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          echo "KUBEBUILDER_ASSETS=$($(go env GOPATH)/bin/setup-envtest use 1.32.x --bin-dir "$RUNNER_TEMP/envtest" -p path)" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: go test ./tests/integration -v -coverprofile=integration.out -coverpkg=./...

      - name: Report coverage
        run: |
          go tool cover -func=integration.out | awk 'END {print "Integration tests coverage: " $3}'

  helm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint chart
        run: helm lint ./mr-cassop

      - name: Render chart
        run: helm template mr-cassop ./mr-cassop --namespace mr-cassop-system

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build docs
        working-directory: docs
        run: |
          npm ci
          npm run build

  image-builds:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, helm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: operator
            context: .
            dockerfile: Dockerfile
          - name: prober
            context: prober
            dockerfile: prober/Dockerfile
          - name: cassandra
            context: cassandra
            dockerfile: cassandra/Dockerfile
          - name: jolokia
            context: jolokia
            dockerfile: jolokia/Dockerfile
          - name: icarus
            context: icarus
            dockerfile: icarus/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build image
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: "ghcr.io/cin/mr-cassop/${{ matrix.name }}:pr-${{ github.event.pull_request.number }}"
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number }}
            ICARUS_VERSION=${{ env.ICARUS_VERSION }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/cin/mr-cassop/${{ matrix.name }}:pr-${{ github.event.pull_request.number }}
          exit-code: "1"
          ignore-unfixed: true
          severity: ${{ env.TRIVY_SEVERITY }}

  e2e-tests:
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    needs: [image-builds]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run e2e tests
        run: make e2e-tests
