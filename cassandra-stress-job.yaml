apiVersion: batch/v1
kind: Job
metadata:
  name: cassandra-stress
  namespace: cassop
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: cassandra-stress
          image: ghcr.io/cin/mr-cassop/cassandra:dev
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -c
            - |
              set -e
              STRESS=/opt/cassandra/tools/bin/cassandra-stress
              COMMON="-mode native cql3 user=$CASSANDRA_USER password=$CASSANDRA_PASSWORD -node local-cluster-cassandra-dc1"

              # `read` requires the cluster to already be fully populated by a completed
              # write - reading concurrently with an in-progress write hits not-yet-written
              # keys and crashes ("Failed to execute warmup"). So pre-populate a fixed key
              # range first, then let `read` stay pinned to that already-written range while
              # `write` keeps going against the full (larger, effectively non-overlapping) range.
              $STRESS write n=50000 -pop seq=1..50000 -rate threads=4 $COMMON

              # Steady write load for 5 minutes, throttled to a modest fixed rate.
              $STRESS write duration=5m -rate threads=4 fixed=50/s $COMMON &
              WRITE_PID=$!

              # Steady low-rate reads against the pre-populated range only.
              $STRESS read duration=290s -pop seq=1..50000 -rate threads=2 fixed=10/s $COMMON &
              READ_PID=$!

              wait "$WRITE_PID"
              wait "$READ_PID"
          env:
            - name: CASSANDRA_USER
              valueFrom:
                secretKeyRef:
                  name: admin-secret
                  key: admin-role
            - name: CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-secret
                  key: admin-password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
